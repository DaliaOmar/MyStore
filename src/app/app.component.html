<!DOCTYPE html>
<html>
<body>
<header class="site-header">
  <div class="header-inner">
    <a routerLink="/" class="brand">
      <span class="brand-moon">🌙</span>
      <div class="brand-text">
        <span class="brand-name">Pajama Store</span>
        <span class="brand-tagline">Premium Pajamas</span>
      </div>
    </a>

    <nav class="site-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">Shop</a>
      <a routerLink="/cart" routerLinkActive="active" class="nav-link cart-link">
        <span>Cart</span>
        <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </a>
    </nav>
  </div>
</header>

<main class="site-main">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <p>🌙 Pajama Store — Sleep well, look good. &copy; 2026</p>
</footer>
</body>
</html>
